<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB Dread">
  <meta name="theme-color" content="#05060d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon_192.png">
  <link rel="apple-touch-icon" href="assets/icon_192.png">
  <title>CRYPTO BROS: Streets of the Lost Ledger (Dread Experiment)</title>
  <style>
    html, body { margin: 0; background: #000; width: 100%; height: 100%; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #game { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right); outline: none; }
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    body.touch #touch { display: block; }
    #dpad { pointer-events: auto; position: absolute; width: 36vh; height: 36vh; max-width: 180px; max-height: 180px; min-width: 120px; min-height: 120px;
      left: calc(env(safe-area-inset-left) + 1vh); bottom: calc(env(safe-area-inset-bottom) + 1vh);
      border-radius: 50%; background: rgba(127,233,255,0.07); border: 2px solid rgba(127,233,255,0.30); touch-action: none; }
    #dpad::before { content: ''; position: absolute; inset: 33% 8%; background: rgba(255,255,255,0.08); border-radius: 8px; }
    #dpad::after  { content: ''; position: absolute; inset: 8% 33%; background: rgba(255,255,255,0.08); border-radius: 8px; }
    #knob { position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: rgba(127,233,255,0.35); z-index: 1; }
    .btn { pointer-events: auto; position: absolute; border-radius: 50%; touch-action: none; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.9); font: bold 11px monospace; background: rgba(127,233,255,0.10); border: 2px solid rgba(127,233,255,0.40);
      width: 15vh; height: 15vh; min-width: 52px; min-height: 52px; max-width: 76px; max-height: 76px; }
    .btn.on { background: rgba(127,233,255,0.45); }
    .b-jump    { right: calc(env(safe-area-inset-right) + 2vh);  bottom: calc(env(safe-area-inset-bottom) + 4vh); background: rgba(46,204,113,0.22) !important; }
    .b-shoot   { right: calc(env(safe-area-inset-right) + 20vh); bottom: calc(env(safe-area-inset-bottom) + 2vh); background: rgba(229,57,53,0.22) !important; }
    .b-counter { right: calc(env(safe-area-inset-right) + 20vh); bottom: calc(env(safe-area-inset-bottom) + 21vh); background: rgba(255,211,77,0.25) !important; }
    .b-slide   { right: calc(env(safe-area-inset-right) + 38vh); bottom: calc(env(safe-area-inset-bottom) + 2vh); }
    .b-dash    { right: calc(env(safe-area-inset-right) + 2vh);  bottom: calc(env(safe-area-inset-bottom) + 23vh); background: rgba(255,61,110,0.22) !important; }
    .small { pointer-events: auto; position: absolute; top: calc(env(safe-area-inset-top) + 1vh); padding: 6px 10px; border-radius: 10px; touch-action: none;
      color: #fff; font: bold 12px monospace; background: rgba(0,0,0,0.45); border: 1px solid rgba(127,233,255,0.45); }
    .small.on { background: rgba(127,233,255,0.45); }
    #mapBtn { right: calc(env(safe-area-inset-right) + 1vh + 74px); top: calc(env(safe-area-inset-top) + 70px); }
    #startBtn { right: calc(env(safe-area-inset-right) + 1vh); top: calc(env(safe-area-inset-top) + 70px); }
    #fsBtn { pointer-events: auto; position: fixed; z-index: 11; bottom: 8px; left: 8px;
      padding: 4px 8px; border-radius: 8px; font: bold 14px monospace; color: #fff; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.35); }
    #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #05060d; color: #7fe9ff;
      font: bold 13px monospace; text-align: center; flex-direction: column; align-items: center; justify-content: center; }
    #rotate .phone { width: 60px; height: 100px; border: 4px solid #7fe9ff; border-radius: 10px; margin-bottom: 20px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser-arcade-physics.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="touch">
    <div id="dpad"><div id="knob"></div></div>
    <div class="btn b-jump" data-b="jump">JUMP</div>
    <div class="btn b-shoot" data-b="shoot">SHOOT</div>
    <div class="btn b-counter" data-b="counter">COUNTER</div>
    <div class="btn b-slide" data-b="slide">SLIDE</div>
    <div class="btn b-dash" data-b="dash">DASH</div>
    <div class="small" id="mapBtn" data-b="map">MAP</div>
    <div class="small" id="startBtn" data-b="start">START</div>
  </div>
  <button id="fsBtn" title="Fullscreen">⛶</button>
  <div id="rotate"><div class="phone"></div>Turn your phone sideways<br><span style="font-size:13px;color:#ccc">to play CRYPTO BROS: Dread Experiment</span></div>
  <script src="config.js?v=1"></script>
  <script src="audio.js?v=1"></script>
  <script src="controls.js?v=1"></script>
  <script src="hero.js?v=1"></script>
  <script src="art.js?v=1"></script>
  <script src="game.js?v=1"></script>
</body>
</html>
